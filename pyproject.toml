[project]
name = "py-trie-index"
version = "0.1.2"
description = "A prefix tree that answers autocomplete queries over a fixed vocabulary in time proportional to the query length plus the number of matches."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
